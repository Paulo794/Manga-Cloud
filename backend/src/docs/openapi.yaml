openapi: 3.0.3
info:
  title: 'MangaCloud API'
  version: 2.0.0
  description: 'Estantes privadas, catálogo e leitura. MangaDex real não possui paywall comercial; assinatura de teste aplica-se ao Demo. Papel e plano são independentes.'
servers:
  -
    url: /api
security:
  -
    BearerAuth: []
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
    Shelf:
      type: object
      properties:
        id:
          type: integer
        nome:
          type: string
          maxLength: 100
        descricao:
          type: string
          maxLength: 1000
          nullable: true
        totalItens:
          type: integer
        possuiCapa:
          type: boolean
    Subscription:
      type: object
      properties:
        plano:
          type: string
          enum:
            - free
            - pro
        isPro:
          type: boolean
        status:
          type: string
        acessoAte:
          type: string
          format: date-time
          nullable: true
        cancelAtPeriodEnd:
          type: boolean
        canManageRenewal:
          type: boolean
    Manifest:
      type: object
      properties:
        provider:
          type: string
          enum:
            - demo
            - mangadex
            - anilist
        chapterId:
          type: string
        mangaId:
          type: string
        title:
          type: string
        language:
          type: string
        totalPages:
          type: integer
        pages:
          type: array
          items:
            type: object
            properties:
              pageNumber:
                type: integer
              imageUrl:
                type: string
